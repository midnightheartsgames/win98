<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOOM 98</title>
<link rel="stylesheet" href="css/apps/doom.css">
<style>html,body{height:100%;margin:0;background:#008080}body{display:grid;place-items:center}.window{width:min(98vw,1000px);height:96vh;border:3px outset #ddd;display:flex;flex-direction:column;background:silver}.title{background:linear-gradient(90deg,navy,#1084d0);color:#fff;font:bold 12px Tahoma;padding:5px}#game{flex:1;min-height:0}</style></head>
<body><main class="window"><div class="title">DOOM 98</div><div id="game"></div></main>
<script src="js/apps/doom/doom-data.js"></script><script src="js/apps/doom/doom-gfx.js"></script><script src="js/apps/doom/doom-level.js"></script><script src="js/apps/doom/doom-maps.js"></script><script src="js/apps/doom/doom-core.js"></script><script src="js/apps/doom/doom-render.js"></script><script src="js/apps/doom/doom-audio.js"></script><script src="js/apps/doom/doom-ui.js"></script>
<script>const el=document.getElementById('game');const ui=new Doom98.UI(el);el.focus();addEventListener('pagehide',()=>ui.destroy(),{once:true});</script>
</body></html>
