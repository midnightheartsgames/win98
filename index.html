  <svg class="win-svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <filter id="win98-selected" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feFlood flood-color="#000080" x="0" y="0" width="1" height="1" result="dotA"/>
      <feFlood flood-color="#000080" x="1" y="1" width="1" height="1" result="dotB"/>
      <feMerge x="0" y="0" width="2" height="2" result="cell">
        <feMergeNode in="dotA"/>
        <feMergeNode in="dotB"/>
      </feMerge>
      <feTile in="cell" result="dither"/>
      <feComposite in="dither" in2="SourceAlpha" operator="in" result="tint"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="tint"/>
      </feMerge>
    </filter>
    <filter id="fx-low-color" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="discrete" tableValues="0 0.5 1"/>
        <feFuncG type="discrete" tableValues="0 0.5 1"/>
        <feFuncB type="discrete" tableValues="0 0.5 1"/>
        <feFuncA type="discrete" tableValues="0 1"/>
      </feComponentTransfer>
    </filter>
    <filter id="fx-aliased-text" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 1"/>
      </feComponentTransfer>
    </filter>
  </svg>
