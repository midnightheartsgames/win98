<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diablo II</title>

<script>const el=document.getElementById('game');const ui=new Diablo2.UI(el,{});window.d2ui=ui;el.focus();addEventListener('pagehide',()=>ui.destroy(),{once:true});</script>
</body></html>
