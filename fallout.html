<script>
const params = new URLSearchParams(location.search);
const game = new FO.Game(document.getElementById('game'), {
  standalone: true,
  lang: params.get('lang') === 'ru' ? 'ru' : 'en',
  map: params.get('map') || 'V13ENT',
  start: async g => {
    if (params.get('map')) await FO.newGame(g, params.get('map'), +(params.get('tile') || -1), +(params.get('elev') || -1));
    else await FO.boot(g);
  }
});
window.fogame = game;
game.el.focus();
game.boot('content/Fallout/', 'content/fallout-ru/');
addEventListener('pagehide', () => game.destroy(), { once: true });
</script>
