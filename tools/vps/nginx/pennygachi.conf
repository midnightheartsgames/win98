proxy_cache_path /var/cache/nginx/pennygachi levels=1:2 keys_zone=pennygachi:50m max_size=60g inactive=90d use_temp_path=off;

map $http_upgrade $pennygachi_upgrade {
    default upgrade;
    '' close;
}

upstream cloud4box {
    server 185.154.20.52:443;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    location = /vps-check {
        default_type text/plain;
        return 200 "pennygachi vps ok\n";
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name pennygachi.men www.pennygachi.men;

    location / {
        return 301 https://pennygachi.men$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name pennygachi.men www.pennygachi.men;

    ssl_certificate /etc/letsencrypt/live/pennygachi.men/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pennygachi.men/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:pennygachi_tls:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;

    location = /vps-check {
        default_type text/plain;
        return 200 "pennygachi vps ok\n";
    }

    location ^~ /api/net/admin {
        return 404;
    }

    location ^~ /api/net {
        proxy_pass http://127.0.0.1:39900;
        proxy_http_version 1.1;
        proxy_set_header Host pennygachi.men;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pennygachi_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ^~ /api/bugs {
        client_max_body_size 12m;
        proxy_pass http://127.0.0.1:39899;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host pennygachi.men;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location ^~ /api/ {
        return 404;
    }

    location ~ ^/(web98/)?update/(blobs/|[^/]+/manifest-[^/]+\.json(\.sig)?$|[^/]+/[^/]+-[0-9][^/]*\.(apk|zip)$) {
        slice 16m;
        proxy_cache pennygachi;
        proxy_cache_key $uri$slice_range;
        proxy_cache_valid 200 206 30d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 60s;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        include snippets/pennygachi-origin.conf;
        proxy_set_header Range $slice_range;
        add_header X-Cache $upstream_cache_status always;
        proxy_pass https://cloud4box;
    }

    location ~ ^/((web98/)?update/|files/|sr98/[^/]+\.apk$) {
        slice 16m;
        proxy_cache pennygachi;
        proxy_cache_key $uri$is_args$args$slice_range;
        proxy_cache_valid 200 206 1m;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 60s;
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        include snippets/pennygachi-origin.conf;
        proxy_set_header Range $slice_range;
        add_header X-Cache $upstream_cache_status always;
        proxy_pass https://cloud4box;
    }

    location / {
        include snippets/pennygachi-origin.conf;
        proxy_pass https://cloud4box;
    }
}
