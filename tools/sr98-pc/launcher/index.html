<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Star Rail 98</title>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <div class="hsrs-page lw-page">
    <div class="hsrs-frame lw-frame">
      <div class="lw-head">
        <div class="lw-head-left">
          <div class="hsrs-logo-big">Star Rail <span class="hsrs-logo-98">98</span></div>
          <p class="hsrs-motto" data-en="May this journey lead us starward">Да приведёт нас этот путь к звёздам</p>
        </div>
        <div class="hsrs-window lw-window"><img src="img/hsr98-1.jpg" width="176" height="132" alt=""></div>
        <div class="lw-controls"><button class="hsrs-btn" id="b-min" title="Свернуть" data-en-title="Minimize">_</button><button class="hsrs-btn" id="b-close" title="Закрыть" data-en-title="Close">×</button></div>
      </div>
      <nav class="hsrs-route lw-route" id="route" aria-label="Версии / Versions"></nav>
      <div class="lw-body">
        <div class="hsrs-body lw-main" id="main" tabindex="-1"></div>
        <div class="lw-side">
          <div class="hsrs-ticket-mini lw-ticket" aria-live="polite">
            <div class="hsrs-ticket-mini-h"><span data-en="Express Ticket">Билет на Экспресс</span> <span class="lw-no" id="t-no"></span></div>
            <table class="lw-rows" id="t-rows" cellspacing="0"></table>
            <div class="lw-bar" id="t-bar" hidden><div class="lw-bar-fill" id="t-fill"></div></div>
            <p class="lw-note" id="t-note"></p>
            <div class="lw-actions" id="t-actions"></div>
          </div>
          <div class="hsrs-box">
            <div class="hsrs-box-h" data-en="Player sites">Сайты игроков</div>
            <p class="hsrs-small" data-en-html="&lt;a data-url=&quot;https://pennygachi.men/web98/kovcheg/&quot;&gt;Kovcheg&lt;/a&gt;: tier list and guides"><a data-url="https://pennygachi.men/web98/kovcheg/">«Ковчег»</a>: тир-лист и гайды</p>
            <p class="hsrs-small" data-en-html="&lt;a data-url=&quot;https://pennygachi.men/web98/sr98wiki/&quot;&gt;AstralWiki&lt;/a&gt;: player encyclopedia"><a data-url="https://pennygachi.men/web98/sr98wiki/">АстралВики</a>: энциклопедия игроков</p>
            <p class="hsrs-small"><a data-url="https://pennygachi.men/web98/sr98/" data-en="Star Rail 98 website">Сайт Star Rail 98</a></p>
          </div>
        </div>
      </div>
      <div class="hsrs-foot lw-foot">
        <a data-url="https://t.me/Penny_Gachimen">Telegram</a> · <a id="l-settings" data-en="Settings">Настройки</a> · <span id="f-left"></span> · <span data-en="Midnight Hearts fan project">фанатский проект Midnight Hearts</span>
      </div>
    </div>
  </div>
  <script src="launcher.js"></script>
</body>
</html>
