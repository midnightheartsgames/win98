<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Star Rail 98</title>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <div class="hsrs-page lw-page">
    <div class="hsrs-frame lw-frame">
      <div class="lw-head">
        <div class="lw-head-left">
          <div class="hsrs-logo-big">Star Rail <span class="hsrs-logo-98">98</span></div>
          <p class="hsrs-motto">Да приведёт нас этот путь к звёздам</p>
        </div>
        <div class="hsrs-window lw-window"><img src="img/hsr98-1.jpg" width="176" height="132" alt=""></div>
        <div class="lw-controls"><button class="hsrs-btn" id="b-min" title="Свернуть">_</button><button class="hsrs-btn" id="b-close" title="Закрыть">×</button></div>
      </div>
      <nav class="hsrs-route lw-route" id="route" aria-label="Версии"></nav>
      <div class="lw-body">
        <div class="hsrs-body lw-main" id="main" tabindex="-1"></div>
        <div class="lw-side">
          <div class="hsrs-ticket-mini lw-ticket" aria-live="polite">
            <div class="hsrs-ticket-mini-h">Билет на Экспресс <span class="lw-no" id="t-no"></span></div>
            <table class="lw-rows" id="t-rows" cellspacing="0"></table>
            <div class="lw-bar" id="t-bar" hidden><div class="lw-bar-fill" id="t-fill"></div></div>
            <p class="lw-note" id="t-note"></p>
            <div class="lw-actions" id="t-actions"></div>
          </div>
          <div class="hsrs-box">
            <div class="hsrs-box-h">Сайты игроков</div>
            <p class="hsrs-small"><a data-url="https://pennygachi.men/web98/kovcheg/">«Ковчег»</a>: тир-лист и гайды</p>
            <p class="hsrs-small"><a data-url="https://pennygachi.men/web98/sr98wiki/">АстралВики</a>: энциклопедия игроков</p>
            <p class="hsrs-small"><a data-url="https://pennygachi.men/web98/sr98/">Сайт Star Rail 98</a></p>
          </div>
        </div>
      </div>
      <div class="hsrs-foot lw-foot">
        <a data-url="https://t.me/Penny_Gachimen">Telegram</a> · <a id="l-settings">Настройки</a> · <span id="f-left"></span> · фанатский проект Midnight Hearts
      </div>
    </div>
  </div>
  <script src="launcher.js"></script>
</body>
</html>
