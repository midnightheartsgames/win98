<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catniss</title>
<link rel="stylesheet" href="css/apps/catniss.css">
<style>html,body{height:100%;margin:0;background:#008080}body{display:grid;place-items:center}.window{width:min(98vw,970px);height:min(96vh,750px);border:3px outset #ddd;display:flex;flex-direction:column;background:silver}.title{background:linear-gradient(90deg,navy,#1084d0);color:#fff;font:bold 12px Tahoma;padding:5px}#game{flex:1;min-height:0;position:relative}</style></head>
<body><main class="window"><div class="title">Catniss</div><div id="game"></div></main>
<script src="js/apps/catniss/cn-core.js"></script><script src="js/apps/catniss/cn-sim.js"></script><script src="js/apps/catniss/cn-levels.js"></script><script src="js/apps/catniss/cn-assets.js"></script><script src="js/apps/catniss/cn-render.js"></script><script src="js/apps/catniss/cn-audio.js"></script><script src="js/apps/catniss/cn-ui.js"></script><script src="js/apps/catniss/cn-screens.js"></script>
<script>const el=document.getElementById('game');const ui=new Catniss.UI(el,{standalone:true});window.cnui=ui;el.focus();addEventListener('pagehide',()=>ui.destroy(),{once:true});</script>
</body></html>
